<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ahmed Sayed Galal — Architect | أحمد سيد جلال — مهندس معماري</title>
    <link rel ="icon" type="image/png" href="/favicon.png" /> 
    <meta
      name="description"
      content="Portfolio of Ahmed Sayed Galal, Architect based in Cairo, Egypt. AutoCAD, Revit, 3ds Max, Lumion — residential, commercial and interior projects."
    />
    <meta name="theme-color" content="#0e2036" />
    <script>
      /* Apply the saved theme + language before the app loads
         تطبيق الوضع واللغة المحفوظين قبل تحميل الموقع */
      (function () {
        try {
          var theme = localStorage.getItem("ag-theme") || "dark";
          document.documentElement.classList.toggle("dark", theme !== "light");
          document.documentElement.style.colorScheme = theme;
          var lang = localStorage.getItem("ag-lang");
          if (lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
